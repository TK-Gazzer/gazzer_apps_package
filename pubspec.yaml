name: gazzer_apps
description: Gazzer Apps shared package.
version: 0.0.1
homepage:

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
    
  flutter_localizations:
    sdk: flutter
  intl: any

  # UI kit (package:gazzer_apps/gazzer_ui.dart)
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.1
  vector_graphics: ^1.1.19
  cached_network_image: ^3.4.1
  skeletonizer: ^2.1.0+1
  flutter_spinkit: ^5.2.2
  fluttertoast: '>=8.2.14 <10.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  generate: true

  assets:
    - assets/png/
    - assets/svg/

  fonts:
    - family: poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/poppins/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/poppins/Poppins-BlackItalic.ttf
          weight: 900
          style: italic
    - family: inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: playfair
      fonts:
        - asset: assets/fonts/Playfair.ttf
    - family: roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Light.ttf
          weight: 200
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Roboto/Roboto-Black.ttf
          weight: 900
    - family: Alexandria
      fonts:
        - asset: assets/fonts/alexandria/Alexandria-Black.ttf
        - asset: assets/fonts/alexandria/Alexandria-Bold.ttf
        - asset: assets/fonts/alexandria/Alexandria-ExtraBold.ttf
        - asset: assets/fonts/alexandria/Alexandria-ExtraLight.ttf
        - asset: assets/fonts/alexandria/Alexandria-Light.ttf
        - asset: assets/fonts/alexandria/Alexandria-Medium.ttf
        - asset: assets/fonts/alexandria/Alexandria-Regular.ttf
        - asset: assets/fonts/alexandria/Alexandria-SemiBold.ttf
        - asset: assets/fonts/alexandria/Alexandria-Thin.ttf

